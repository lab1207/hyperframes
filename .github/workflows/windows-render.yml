name: Windows render verification
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "unused"
        required: false
        default: ""
jobs:
  probe:
    name: "probe ${{ matrix.case }}"
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: A-orphan-hang, run: "node .github/probe/orphan.js hang", limit: 1 }
          - { case: B-plain-hang, run: "node .github/probe/orphan.js none", limit: 1 }
          - { case: C-orphan-exit, run: "node .github/probe/orphan.js exit", limit: 3 }
          - { case: D-wrapped-orphan-hang, run: "pwsh .github/scripts/windows-step-deadline.ps1 -Minutes 1 -Command 'node .github/probe/orphan.js hang'", limit: 3 }
          - { case: E-wrapped-orphan-exit, run: "pwsh .github/scripts/windows-step-deadline.ps1 -Minutes 1 -Command 'node .github/probe/orphan.js exit'", limit: 3 }
          - { case: F-wrapped-ok, run: "pwsh .github/scripts/windows-step-deadline.ps1 -Minutes 1 -Command 'node .github/probe/orphan.js ok; exit 3'", limit: 3 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe step
        shell: pwsh
        timeout-minutes: ${{ matrix.limit }}
        run: |
          Write-Host "start $(Get-Date -Format o)"
          ${{ matrix.run }}
          Write-Host "exit $LASTEXITCODE"
      - name: After
        if: always()
        shell: pwsh
        run: Write-Host "after $(Get-Date -Format o)"
